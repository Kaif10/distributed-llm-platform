syntax = "proto3";

package infer.v1;

option go_package = "dsys/gen/infer/v1;inferv1";

// Inference is the WORKER-facing API: what the gateway speaks to an
// inference worker (a Python process hosting a model, or the Go mock used
// in tests and benchmarks). Clients never call this directly; they call the
// gateway, which adds rate limiting, caching, routing and hedging in front.
service Inference {
  // Generate streams tokens for one prompt. Cancelling the stream (client
  // context cancel) must stop generation on the worker: tokens after a
  // cancel are wasted GPU time, and with hedging (gateway) the loser of a
  // hedge race is cancelled precisely so it stops burning compute.
  rpc Generate(GenerateRequest) returns (stream Token);
  // Health reports current load so the gateway can route around a busy
  // worker.
  rpc Health(HealthRequest) returns (HealthResponse);
}

message GenerateRequest {
  // request_id lets a worker log/trace one request across a hedge race
  // (both hedged attempts carry the same id).
  string request_id = 1;
  string tenant = 2;
  string prompt = 3;
  int32 max_tokens = 4;
}

message Token {
  string text = 1;
  int32 index = 2;
  bool done = 3;
  string finish_reason = 4; // "stop" | "length" | "cancelled"

  // Observability, set on the FIRST token of a stream: how long prefill
  // took and whether the worker's prefix (KV) cache covered part of the
  // prompt. This is what the Phase 5 benchmark reads to show that
  // prefix-aware routing raises the cache-hit rate.
  int64 prefill_ms = 5;
  bool prefix_cache_hit = 6;
  int32 cached_prefix_chars = 7;
}

message HealthRequest {}
message HealthResponse {
  string worker_id = 1;
  int32 inflight = 2;
  string model = 3;
}
