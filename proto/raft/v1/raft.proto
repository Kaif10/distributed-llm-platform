syntax = "proto3";

package raft.v1;

option go_package = "dsys/gen/raft/v1;raftv1";

// Raft is the node-to-node RPC surface of the consensus algorithm
// (Ongaro & Ousterhout, Figure 2 and Figure 13). Every message mirrors the
// Go struct of the same name in package dsys/raft field-for-field; the
// conversion lives in dsys/raft/grpctransport.
service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// Entry is one log entry. Its index is implicit from its position.
message Entry {
  uint64 term = 1;
  bytes command = 2;
}

message RequestVoteRequest {
  uint64 term = 1;
  int32 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}
message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

// Empty entries is a heartbeat.
message AppendEntriesRequest {
  uint64 term = 1;
  int32 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated Entry entries = 5;
  uint64 leader_commit = 6;
}
// conflict_term / conflict_index are the accelerated log backtracking hints
// (section 5.3); only meaningful when success is false.
message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 conflict_term = 3;
  uint64 conflict_index = 4;
}

// Snapshots are sent whole (no chunking).
message InstallSnapshotRequest {
  uint64 term = 1;
  int32 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
}
message InstallSnapshotResponse {
  uint64 term = 1;
}
