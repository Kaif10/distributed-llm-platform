# Prometheus scrapes the gateway and sched processes DIRECTLY (client_golang
# /metrics endpoints), never through the otel-collector — see the comment
# header in otel-collector-config.yaml for why.
#
# host.docker.internal is used unconditionally, by design: this compose file
# is meant to work standalone against gateway/sched run directly on the host
# (`go run ./cmd/gateway -metrics-addr :9091`, `go run ./cmd/sched
# -metrics-addr :9092`), which is also the deployment scripts/e2e_llm.sh and
# the k6 load test exercise. If you instead run gateway/sched as containers
# under the OTHER engineer's docker-compose.yml, either publish their
# metrics ports to the host (so host.docker.internal:9091/9092 still
# resolves) or add a second scrape target here for their service name --
# this file intentionally does not assume that stack's service names exist.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          service: gateway
  - job_name: sched
    static_configs:
      - targets: ["host.docker.internal:9092"]
        labels:
          service: sched
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"] # the collector's own internal telemetry
