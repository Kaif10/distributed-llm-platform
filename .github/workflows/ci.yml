name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    name: build, vet, race tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "not gofmt'd:"; echo "$unformatted"; exit 1; fi
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test (race detector, every package)
        run: go test -race -count=1 -timeout 30m ./...

  python:
    name: python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile py/*.py scripts/*.py
